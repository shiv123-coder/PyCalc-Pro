<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 800px;
            height: 600px;
            background-color: #0E1117;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Loading text */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00D4FF;
            font-family: sans-serif;
            font-size: 1.2rem;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="loading">Loading PyCalc Pro...</div>
    <!-- Load the Streamlit app. Note: ?embed=true removes the padding and sidebar for a cleaner look -->
    <iframe src="https://pycalc-pro-shiv.streamlit.app/?embed=true"></iframe>
</body>
</html>
