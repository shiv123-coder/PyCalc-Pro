<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 800px;
            height: 600px;
            background-color: #0E1117;
            display: flex;
            flex-direction: column;
        }
        .header {
            background-color: #1A1D23;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .header-title {
            color: #FAFAFA;
            font-family: sans-serif;
            font-weight: bold;
            font-size: 14px;
        }
        .solve-btn {
            background-color: #00D4FF;
            color: #0E1117;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-family: sans-serif;
            font-size: 12px;
            transition: background 0.2s;
        }
        .solve-btn:hover {
            background-color: #00b3d8;
        }
        .solve-btn:active {
            transform: scale(0.98);
        }
        iframe {
            width: 100%;
            flex-grow: 1;
            border: none;
        }
        /* Loading text */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00D4FF;
            font-family: sans-serif;
            font-size: 1.2rem;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">🧮 PyCalc Pro Dashboard</div>
        <button id="solve-btn" class="solve-btn">🪄 Auto-Solve Webpage</button>
    </div>
    <div class="loading">Loading PyCalc Pro...</div>
    <!-- Load the Streamlit app. Note: ?embed=true removes the padding and sidebar for a cleaner look -->
    <iframe src="https://pycalc-pro-shiv.streamlit.app/?embed=true"></iframe>
    
    <script src="popup.js"></script>
</body>
</html>
